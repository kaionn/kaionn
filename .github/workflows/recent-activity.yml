name: Update Recent Activity

on:
  # 毎日 UTC 0:00 に実行（JST 9:00）※ 他ワークフローと同時刻
  schedule:
    - cron: "0 0 * * *"
  # 手動実行
  workflow_dispatch:
  # main ブランチへの push 時（初回生成用）
  push:
    branches:
      - main

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "docs: 最近のアクティビティを更新"
          MAX_LINES: 8
